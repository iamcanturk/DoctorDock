version: 2

project_name: doctordock

before:
  hooks:
    - go mod tidy

builds:
  - id: doctordock
    main: ./cmd/doctordock
    binary: doctordock
    env:
      # A static binary is the whole point: users must not need a Go toolchain,
      # a libc version or anything else installed.
      - CGO_ENABLED=0
    # Distribution is Mac-first (Homebrew), plus Linux so the container image
    # and `go install` work for CI. Windows is not a target — no Scoop, no
    # windows archives.
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/RULES.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Rules
      regexp: '^.*?(feat|fix)\(rules\).*$'
      order: 1
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request

# The primary Mac install path. A cask (not a formula) because DoctorDock ships
# a prebuilt binary rather than building from source.
homebrew_casks:
  - name: doctordock
    binaries:
      - doctordock
    repository:
      owner: iamcanturk
      name: homebrew-tap
      # The default GITHUB_TOKEN cannot push to another repo, so a PAT is used.
      # Running goreleaser locally, gh's token has the scope already.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://doctordock.iamcanturk.dev
    description: Local-first Docker diagnostics — security, configuration and cleanup findings
    license: MIT
    # `ddock` is the short alias: the same binary reachable under a second name.
    custom_block: |
      binary "doctordock", target: "ddock"
    hooks:
      post:
        # The binaries are not notarized, so Gatekeeper would quarantine them
        # and macOS would refuse to run the tool. Homebrew clears that on install.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/doctordock"]
          end

# The container image, for running DoctorDock in CI without installing anything.
# Built per-arch (each stages its own linux binary into the context), then
# combined into one multi-arch tag by docker_manifests below.
dockers:
  - id: doctordock-amd64
    ids: [doctordock]
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/iamcanturk/doctordock:{{ .Version }}-amd64"
      - "ghcr.io/iamcanturk/doctordock:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Local-first Docker diagnostics"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/iamcanturk/DoctorDock"
      - "--label=org.opencontainers.image.licenses=MIT"
  - id: doctordock-arm64
    ids: [doctordock]
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/iamcanturk/doctordock:{{ .Version }}-arm64"
      - "ghcr.io/iamcanturk/doctordock:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Local-first Docker diagnostics"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/iamcanturk/DoctorDock"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/iamcanturk/doctordock:{{ .Version }}"
    image_templates:
      - "ghcr.io/iamcanturk/doctordock:{{ .Version }}-amd64"
      - "ghcr.io/iamcanturk/doctordock:{{ .Version }}-arm64"
  - name_template: "ghcr.io/iamcanturk/doctordock:latest"
    image_templates:
      - "ghcr.io/iamcanturk/doctordock:latest-amd64"
      - "ghcr.io/iamcanturk/doctordock:latest-arm64"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```bash
    brew install iamcanturk/tap/doctordock     # macOS
    go install github.com/iamcanturk/DoctorDock/cmd/doctordock@{{ .Tag }}
    ```

    Or run it in CI without installing anything:

    ```bash
    docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
      ghcr.io/iamcanturk/doctordock:{{ .Version }}
    ```
